services:
  - type: web
    name: haulhub-dispatch-api
    env: node
    region: oregon
    plan: free
    buildCommand: NODE_ENV=development npm install --include=dev && npx tsc
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true